<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>
      {% block title %}
        Auth System
      {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'menu-list' %}">Restorante</a>
        <ul class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'users_list' %}">Користувачі</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'orders:order-list' %}">Мої замовлення</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'cart:cart-detail' %}">Кошик</a>
            </li>
            <li class="nav-item">
              <form action="{% url 'logout' %}" class="mx-3" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Вихід</button>
              </form>
            </li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'login' %}">Увійти</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'register' %}">Реєстрація</a>
            </li>
          {% endif %}
        </ul>
      </div>
    </nav>

    <div class="container">
      {% block content %}
      {% endblock %}
    </div>
  </body>
</html>
