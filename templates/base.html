{% load static %}
<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>
      {% block title %}
        Auth System
      {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
      <div class="container">
        <img src="{% static 'images/logo.png' %}" style="height: 80px; width: auto;">
        <a class="navbar-brand" href="{% url 'menu-list' %}">Restorante</a>
        <ul class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'users_list' %}"><i class="fa-solid fa-user" style="color: rgb(116, 192, 252);"></i>Користувачі</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'orders:order-list' %}"><i class="fa-solid fa-check" style="color: rgb(105, 230, 99);"></i>Мої замовлення</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'cart:cart-detail' %}"><i class="fa-solid fa-cart-shopping" style="color: rgb(116, 192, 252);"></i>Кошик</a>
            </li>
            <li class="nav-item">
              <form action="{% url 'logout' %}" class="mx-3" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="fa-solid fa-arrow-right-from-bracket" style="color: rgb(255, 0, 0);"></i>Вихід</button>
              </form>
            </li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'login' %}"><i class="fa-solid fa-arrow-right-to-bracket" style="color: rgb(0, 255, 67);"></i>Увійти</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'register' %}"><i class="fa-solid fa-arrow-right-to-bracket" style="color: rgb(255, 199, 0);"></i>Реєстрація</a>
            </li>
          {% endif %}
        </ul>
      </div>
    </nav>

    <div class="container">
      {% block content %}
      {% endblock %}
    </div>
    <script src="https://kit.fontawesome.com/297c01e60d.js" crossorigin="anonymous"></script>
  </body>
</html>
